# Type signatures that Steep loads for bluepill's dependencies. Run
# `bundle exec rbs collection install` to download them.
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

path: .gem_rbs_collection

gems:
  - name: etc
  - name: fileutils
  - name: logger
  - name: monitor
  - name: net-http
  - name: openssl
  - name: shellwords
  - name: socket
  - name: timeout
  - name: uri
  # This has no published signatures. sig-vendor has a stub instead.
  - name: syslog
    ignore: true
  # Development tools that the signatures don't need
  - name: activesupport
    ignore: true
  - name: diff-lcs
    ignore: true
  - name: maruku
    ignore: true
  - name: prism
    ignore: true
  - name: rake
    ignore: true
  - name: rspec
    ignore: true
  - name: rubocop
    ignore: true
  - name: simplecov
    ignore: true
  - name: steep
    ignore: true
  - name: yard
    ignore: true
