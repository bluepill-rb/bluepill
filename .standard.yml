# Standard's configuration: https://github.com/standardrb/standard
#
# The gem still supports Ruby 1.9.3, so leave out the rules that need a
# newer Ruby
ruby_version: 1.9

ignore:
  # Writing to $stderr keeps errors visible under ruby -W0, which silences
  # warn, and lets the specs capture them
  - '**/*':
      - Style/StderrPuts
  # Daemonizing and running commands reopen file descriptors 0, 1 and 2,
  # which STDIN, STDOUT and STDERR always are. $stdout and the others can
  # be reassigned, say to a StringIO, which reopen wouldn't detach.
  - 'lib/bluepill/daemonize.rb':
      - Style/GlobalStdStream
  - 'lib/bluepill/system/commands.rb':
      - Style/GlobalStdStream
  - 'lib/bluepill/system/daemon.rb':
      - Style/GlobalStdStream
  - 'spec/lib/bluepill/daemonize_spec.rb':
      - Style/GlobalStdStream
  - 'spec/lib/bluepill/system_execute_blocking_spec.rb':
      - Style/GlobalStdStream
  - 'spec/lib/bluepill/system_spec.rb':
      - Style/GlobalStdStream
  # caller only takes a range, or a length, from Ruby 2.0, and the specs
  # run on 1.9.3 too
  - 'spec/spec_helper.rb':
      - Performance/Caller
