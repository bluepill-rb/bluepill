name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.ruby }}
    # ubuntu-22.04 is the only runner image with prebuilt Ruby 1.9.3
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.allow-failure == true }}
    env:
      JRUBY_OPTS: --debug
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '1.9.3'
          - '2.0'
          - '2.1'
          - '2.2'
          - '2.3'
          - '2.4'
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - jruby-9.1
          - jruby-9.2
          - jruby-9.3
          - jruby-9.4
          - jruby-10.0
          - jruby-10.1
        include:
          - ruby: head
            allow-failure: true
          - ruby: jruby-head
            allow-failure: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.ruby == '2.2' && 'none' || 'default' }}
          bundler-cache: ${{ matrix.ruby != '2.2' }}
      # RubyGems on Ruby 2.2 crashes reading the rubygems.org index, so
      # install Bundler from a downloaded .gem file instead.
      - name: Install Bundler and gems
        if: matrix.ruby == '2.2'
        run: |
          curl -fsSLO https://rubygems.org/downloads/bundler-1.17.3.gem
          gem install --local bundler-1.17.3.gem --no-document
          bundle install --jobs 4
      - run: bundle exec rake spec
      - name: Upload coverage to Coveralls
        if: matrix.ruby == '4.0'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          format: simplecov
          fail-on-error: false

  # setup-ruby has no builds of JRuby 1.7 or 9.0, and their Docker images
  # no longer pull, so these install the official release from Maven Central.
  test-legacy-jruby:
    name: jruby-${{ matrix.jruby }}
    runs-on: ubuntu-latest
    env:
      JRUBY_OPTS: --debug
    strategy:
      fail-fast: false
      matrix:
        jruby:
          - '1.7.27'
          - '9.0.5.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '8'
      - name: Install JRuby
        run: |
          curl -fsSL "https://repo1.maven.org/maven2/org/jruby/jruby-dist/${{ matrix.jruby }}/jruby-dist-${{ matrix.jruby }}-bin.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/jruby-${{ matrix.jruby }}/bin" >> "$GITHUB_PATH"
      # JRuby 9.0 ships a jruby-openssl too old to connect to rubygems.org,
      # so download a newer one with curl and install it locally.
      - name: Upgrade jruby-openssl
        if: matrix.jruby == '9.0.5.0'
        run: |
          curl -fsSLO https://rubygems.org/downloads/jruby-openssl-0.10.7-java.gem
          gem install --local jruby-openssl-0.10.7-java.gem --no-document
      - run: gem install bundler -v 1.17.3 --no-document
      - run: bundle install --jobs 4
      - run: bundle exec rake spec

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake rubocop
