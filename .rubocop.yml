plugins:
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Include

AllCops:
  # Duel's configuration is a dotfile, which RuboCop skips unless it's named
  Include:
    - .duel.rb
  # The oldest Ruby the gem supports
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: true

# Standard checks style (see .standard.yml), so RuboCop leaves it to it,
# and checks for bugs, complexity, layout and the specs
Style:
  Enabled: false

# A keyword argument or Hash key whose value is a variable or method of
# its name is written as the shorthand, as in logger:, and the keys stay
# as Standard has them
Style/HashSyntax:
  Enabled: true
  EnforcedStyle: ruby19_no_mixed_keys
  EnforcedShorthandSyntax: always

# An endless method stays on one line, and one whose body ends in a
# modifier, such as `def m = x if y`, would apply the modifier to the def
Style/EndlessMethod:
  Enabled: true

Style/AmbiguousEndlessMethodDefinition:
  Enabled: true

# Frozen string literals change what a file's strings allocate, not how
# the file looks, and Standard leaves them out, so RuboCop asks for the
# comment in every file
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true

# Layout keeps RuboCop's defaults, except where Standard asks for another
# style, which would fail one or the other

# Continued lines are indented a level, not lined up with the first
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

# when and end line up with case, and end with the variable assigned
Layout/CaseIndentation:
  EnforcedStyle: end

Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

# Steep's type annotations start with #:
Layout/LeadingCommentSpace:
  AllowSteepAnnotation: true

Naming/FileName:
  Exclude:
    - local-bluepill

Metrics/BlockLength:
  Exclude:
    - bin/bluepill
    - spec/**/*

# Marshal only reads data from bluepill's own socket and child processes
Security/MarshalLoad:
  Exclude:
    - lib/bluepill/socket.rb
    - lib/bluepill/system/commands.rb

# Keyword arguments name themselves at every call, so only positional ones
# count toward the limit
Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: false

# fire_event and before_transition do something and then say whether it
# worked, so they aren't questions
Naming/PredicateMethod:
  AllowedMethods:
    - fire_event
    - before_transition

# These scripts run in a Ruby of their own, and the specs read what they
# print
RSpec/Output:
  Exclude:
    - spec/support/active_support_config.rb
    - spec/support/core_extensions.rb

# The specs mirror lib, so a class's spec is where its file is
RSpec/SpecFilePathFormat:
  CustomTransform:
    AppProxy: dsl/app_proxy
    ProcessFactory: dsl/process_factory
    ProcessProxy: dsl/process_proxy

# Integration specs, tagged type: :integration, test behavior across
# classes instead of describing one
RSpec/DescribeClass:
  IgnoredMetadata:
    type:
      - integration

