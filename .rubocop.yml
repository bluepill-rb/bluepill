plugins:
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Include

AllCops:
  # Duel's configuration is a dotfile, which RuboCop skips unless it's named
  Include:
    - .duel.rb
  # The oldest Ruby the gem supports
  TargetRubyVersion: 2.5
  NewCops: enable
  SuggestExtensions: true

# Standard checks style and layout (see .standard.yml), so RuboCop leaves
# them to it, and checks for bugs, complexity and the specs
Style:
  Enabled: false

# Frozen string literals change what a file's strings allocate, not how
# the file looks, and Standard leaves them out, so RuboCop asks for the
# comment in every file
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true

Layout:
  Enabled: false

Naming/FileName:
  Exclude:
    - local-bluepill

Metrics/BlockLength:
  Exclude:
    - bin/bluepill
    - spec/**/*

# Marshal only reads data from bluepill's own socket and child processes,
# and in the specs, what the code under test wrote
Security/MarshalLoad:
  Exclude:
    - lib/bluepill/socket.rb
    - lib/bluepill/system/commands.rb
    - spec/spec_helper.rb

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true

# Bluepill never runs under a fiber scheduler, and IO#wait_readable isn't
# on every Ruby it supports
Lint/IncompatibleIoSelectWithFiberScheduler:
  Enabled: false

# fire_event and before_transition do something and then say whether it
# worked, so they aren't questions
Naming/PredicateMethod:
  AllowedMethods:
    - fire_event
    - before_transition

# These scripts run in a Ruby of their own, and the specs read what they
# print
RSpec/Output:
  Exclude:
    - spec/support/active_support_config.rb
    - spec/support/core_extensions.rb

# The specs mirror lib, so a class's spec is where its file is
RSpec/SpecFilePathFormat:
  CustomTransform:
    AppProxy: dsl/app_proxy
    ProcessFactory: dsl/process_factory
    ProcessProxy: dsl/process_proxy

# Integration specs, tagged type: :integration, test behavior across
# classes instead of describing one
RSpec/DescribeClass:
  IgnoredMetadata:
    type:
      - integration

