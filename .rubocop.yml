plugins:
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Include

AllCops:
  # Duel's configuration is a dotfile, which RuboCop skips unless it's named
  Include:
    - .duel.rb
  # The gem still supports Ruby 1.9.3, and 2.0 is the oldest Ruby that
  # RuboCop can check against. CI runs the specs on 1.9.3 to catch syntax
  # that 1.9 does not support.
  TargetRubyVersion: 2.0
  NewCops: enable
  SuggestExtensions: true

# required_ruby_version is 1.9.3, which RuboCop cannot target
Gemspec/RequiredRubyVersion:
  Enabled: false

Naming/FileName:
  Exclude:
    - local-bluepill

Metrics/BlockLength:
  AllowedMethods:
    - state_machine
  Exclude:
    - bin/bluepill
    - spec/**/*

# Marshal only reads data from bluepill's own socket and child processes
Security/MarshalLoad:
  Exclude:
    - lib/bluepill/socket.rb
    - lib/bluepill/system/commands.rb
    - spec/lib/bluepill/application_spec.rb

Lint/SuppressedException:
  Exclude:
    - bin/bluepill
    - lib/bluepill/application.rb
    - lib/bluepill/process_journal.rb
    - lib/bluepill/system.rb
    - spec/spec_helper.rb

Metrics/AbcSize:
  Enabled: false

Metrics/BlockNesting:
  Max: 3

Metrics/ClassLength:
  CountComments: false
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  CountComments: false
  Enabled: false

Metrics/ModuleLength:
  CountComments: false
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Layout/LineLength:
  AllowURI: true
  Enabled: false

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true

Style/SpecialGlobalVars:
  Enabled: false

Style/FormatStringToken:
  EnforcedStyle: unannotated

# Writing to $stderr keeps errors visible under ruby -W0, which silences warn,
# and lets the specs capture them
Style/StderrPuts:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

# __dir__ needs Ruby 2.0
Style/ExpandPathArguments:
  Enabled: false

# Keyword arguments need Ruby 2.0
Style/OptionalBooleanParameter:
  Enabled: false

# %i needs Ruby 2.0
Style/SymbolArray:
  EnforcedStyle: brackets

# Allow the `#: Type` comments that Steep reads
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

# private and protected indented like the methods after them, as Standard wants
Layout/AccessModifierIndentation:
  EnforcedStyle: indent

Style/ClassVars:
  Exclude:
    - lib/bluepill/dsl/process_factory.rb
    - spec/lib/bluepill/dsl/app_proxy_spec.rb
    - spec/lib/bluepill/dsl/process_factory_spec.rb
    - spec/configs_spec.rb

Style/CollectionMethods:
  Enabled: true
  PreferredMethods:
    map:      'collect'
    map!:     'collect!'
    reduce:   'inject'
    find:     'detect'
    find_all: 'select'

Style/Documentation:
  Enabled: false

# A chained call's dot starts its line, indented a level, as Standard wants
Layout/DotPosition:
  EnforcedStyle: leading

Style/DoubleNegation:
  Enabled: false

Style/GuardClause:
  Exclude:
    - lib/bluepill/dsl/process_factory.rb

Layout/MultilineOperationIndentation:
  Enabled: false

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

# No trailing commas, as Standard wants
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: no_comma

# ::Process says Ruby's Process, which is easy to mistake for
# Bluepill::Process in this codebase, even where it's redundant
Style/RedundantConstantBase:
  Enabled: false

# On Ruby 1.9.3, Dir.home raises when HOME isn't set, as it often isn't
# for root under init, and bluepill reads HOME before it knows it's root
Style/EnvHome:
  Enabled: false

# Array#to_h needs Ruby 2.1
Style/HashConversion:
  Enabled: false

# Bluepill never runs under a fiber scheduler, and IO#wait_readable isn't
# on every Ruby it supports
Lint/IncompatibleIoSelectWithFiberScheduler:
  Enabled: false

# units.rb defines Bluepill::Units and mixes it into Numeric, and the
# benchmark helper holds the small doubles the benchmarks share
Style/OneClassPerFile:
  Exclude:
    - lib/bluepill/units.rb
    - duel/duel_helper.rb

# fire_event and before_transition do something and then say whether it
# worked, so they aren't questions
Naming/PredicateMethod:
  AllowedMethods:
    - fire_event
    - before_transition

# These scripts run in a Ruby of their own, and the specs read what they
# print
RSpec/Output:
  Exclude:
    - spec/support/active_support_config.rb
    - spec/support/core_extensions.rb

# The specs mirror lib, so a class's spec is where its file is
RSpec/SpecFilePathFormat:
  CustomTransform:
    AppProxy: dsl/app_proxy
    ProcessFactory: dsl/process_factory
    ProcessProxy: dsl/process_proxy

# Integration specs, tagged type: :integration, test behavior across
# classes instead of describing one
RSpec/DescribeClass:
  IgnoredMetadata:
    type:
      - integration

# Double quotes, as Standard wants
Style/StringLiterals:
  EnforcedStyle: double_quotes
  ConsistentQuotesInMultiline: false

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# A bare rescue, which rescues StandardError, as Standard wants
Style/RescueStandardError:
  EnforcedStyle: implicit

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

# alias_method, as Standard wants
Style/Alias:
  EnforcedStyle: prefer_alias_method
