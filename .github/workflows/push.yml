name: Push gem to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'bluepill-rb/bluepill'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/bluepill
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          # Ruby 4.0's default json is 3, which Sigstore signing can't use (see
          # the signing step). Use 3.4, whose default json is 2.
          ruby-version: '3.4'
      # Install gems fresh instead of from the Actions cache, so a poisoned
      # cache can't end up in a published gem
      - name: Install gems
        run: bundle install --jobs 4
      # Trusted publishing: RubyGems.org trusts this workflow, no API key.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Update RubyGems
        run: gem update --system
      # The tag must match the version the gem builds as (v0.1.4: 0.1.4).
      - name: Build gem
        run: |
          bundle exec rake build
          test -f "pkg/bluepill-${GITHUB_REF_NAME#v}.gem"
      # protobug 0.1.0 passes JSON.parse options that json 3 rejects, and
      # sigstore 0.2.3 still requires it. Installing gems can pull in json 3
      # even on Ruby 3.4, so load sigstore-cli with json 2 activated.
      - name: Sign gem with Sigstore
        run: |
          gem install sigstore-cli -v 0.2.3 --no-document
          ruby -e 'gem "json", "< 3"' \
            -e 'load Gem.bin_path("sigstore-cli", "sigstore-cli", "0.2.3")' \
            sign pkg/*.gem --bundle pkg/bluepill.gem.sigstore.json
      - name: Push gem
        run: gem push pkg/*.gem --attestation pkg/bluepill.gem.sigstore.json
      - name: Wait for release
        run: gem exec rubygems-await pkg/*.gem
      # Use this version's section of CHANGELOG.md as the release notes
      - name: Create GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
