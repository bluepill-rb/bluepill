name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      JRUBY_OPTS: --debug
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - jruby-10.0
          - jruby-10.1
        include:
          - os: ubuntu-24.04
            ruby: head
            allow-failure: true
          - os: ubuntu-24.04
            ruby: jruby-head
            allow-failure: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        continue-on-error: ${{ matrix.allow-failure == true }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - id: spec
        run: bundle exec rake spec
        continue-on-error: ${{ matrix.allow-failure == true }}
      # Runs bluepill for real, as a daemon and in the foreground, which the
      # specs can't, since they stub forking and spawning
      - id: smoke-test
        name: Smoke test
        continue-on-error: ${{ matrix.allow-failure == true }}
        run: bash spec/smoke.sh
      # The Gemfile only installs Steep on Ruby 3.3 and newer, and the types
      # don't depend on the OS
      - id: type-check-steep
        name: Type check with Steep
        continue-on-error: ${{ matrix.allow-failure == true }}
        if: matrix.os == 'ubuntu-24.04' && contains(fromJSON('["3.3", "3.4", "4.0"]'), matrix.ruby)
        run: bundle exec rake steep
      - id: coveralls
        name: Upload coverage to Coveralls
        continue-on-error: ${{ matrix.allow-failure == true }}
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '4.0'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          format: simplecov
          fail-on-error: false
      - name: Note an advisory failure
        if: steps.ruby.outcome == 'failure' || steps.spec.outcome == 'failure' || steps.smoke-test.outcome == 'failure' || steps.type-check-steep.outcome == 'failure' || steps.coveralls.outcome == 'failure'
        run: echo "::warning title=Advisory failure::A step failed, but this job is allowed to fail, so the build still passes"
