name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure == true }}
    env:
      JRUBY_OPTS: --debug
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - jruby-10.0
          - jruby-10.1
        include:
          - os: ubuntu-24.04
            ruby: head
            allow-failure: true
          - os: ubuntu-24.04
            ruby: jruby-head
            allow-failure: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      # Runs bluepill for real, as a daemon and in the foreground, which the
      # specs can't, since they stub forking and spawning
      - name: Smoke test
        run: bash spec/smoke.sh
      # The Gemfile only installs Steep on Ruby 3.3 and newer, and the types
      # don't depend on the OS
      - name: Type check with Steep
        if: matrix.os == 'ubuntu-24.04' && contains(fromJSON('["3.3", "3.4", "4.0"]'), matrix.ruby)
        run: bundle exec rake steep
      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '4.0'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          format: simplecov
          fail-on-error: false
