AllCops:
  # The gem still supports Ruby 1.9.3, and 2.0 is the oldest Ruby that
  # RuboCop can check against. CI runs the specs on 1.9.3 to catch syntax
  # that 1.9 does not support.
  TargetRubyVersion: 2.0
  NewCops: disable
  SuggestExtensions: false

# required_ruby_version is 1.9.3, which RuboCop cannot target
Gemspec/RequiredRubyVersion:
  Enabled: false

Naming/FileName:
  Exclude:
    - local-bluepill

Lint/ScriptPermission:
  Exclude:
    - examples/**/*

# The examples use 0.times and 1.times to show how to define several processes
Lint/UselessTimes:
  Exclude:
    - examples/**/*

Metrics/BlockLength:
  AllowedMethods:
    - state_machine
  Exclude:
    - bin/bluepill
    - examples/**/*
    - local-bluepill
    - spec/**/*

# Marshal only reads data from bluepill's own socket and child processes
Security/MarshalLoad:
  Exclude:
    - lib/bluepill/socket.rb
    - lib/bluepill/system.rb
    - spec/lib/bluepill/application_spec.rb

Lint/SuppressedException:
  Exclude:
    - bin/bluepill
    - lib/bluepill/application.rb
    - lib/bluepill/process_journal.rb
    - lib/bluepill/system.rb
    - local-bluepill
    - spec/spec_helper.rb

Metrics/AbcSize:
  Enabled: false

Metrics/BlockNesting:
  Max: 3

Metrics/ClassLength:
  CountComments: false
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  CountComments: false
  Enabled: false

Metrics/ModuleLength:
  CountComments: false
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Layout/LineLength:
  AllowURI: true
  Enabled: false

Metrics/ParameterLists:
  Max: 4
  CountKeywordArgs: true

Style/SpecialGlobalVars:
  Enabled: false

Style/FormatStringToken:
  EnforcedStyle: unannotated

# Writing to $stderr keeps errors visible under ruby -W0, which silences warn,
# and lets the specs capture them
Style/StderrPuts:
  Enabled: false

Style/GlobalStdStream:
  Enabled: false

# __dir__ needs Ruby 2.0
Style/ExpandPathArguments:
  Enabled: false

# Keyword arguments need Ruby 2.0
Style/OptionalBooleanParameter:
  Enabled: false

# %i needs Ruby 2.0
Style/SymbolArray:
  EnforcedStyle: brackets

Layout/AccessModifierIndentation:
  EnforcedStyle: outdent

Style/ClassVars:
  Exclude:
    - lib/bluepill/dsl/process_factory.rb
    - spec/lib/bluepill/dsl/app_proxy_spec.rb
    - spec/lib/bluepill/dsl/process_factory_spec.rb

Style/CollectionMethods:
  Enabled: true
  PreferredMethods:
    map:      'collect'
    map!:     'collect!'
    reduce:   'inject'
    find:     'detect'
    find_all: 'select'

Style/Documentation:
  Enabled: false

Layout/DotPosition:
  EnforcedStyle: trailing

Style/DoubleNegation:
  Enabled: false

Style/GuardClause:
  Exclude:
    - lib/bluepill/dsl/process_factory.rb

Layout/MultilineOperationIndentation:
  Enabled: false

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: no_space

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
